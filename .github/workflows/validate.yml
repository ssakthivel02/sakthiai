name: Validate SakthiAI flagship
on:
  pull_request:
  push:
    branches: [main, release/flagship-v1]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Structural and safety validation
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f assets/styles.css
          test -f assets/app.js
          test -f assets/capabilities.js
          test -f assets/runtime.js
          test -f assets/agent-control.css
          test -f assets/agent-control-ui.js
          test -f config/runtime-policy.json
          test -f config/capability-contracts.json
          test -f config/executor-contracts.json
          test -f src/worker.js
          test -f src/auth.js
          test -f src/rbac.js
          test -f src/quota.js
          test -f src/agent-state.js
          test -f src/agent-control.js
          test -f src/agent-api.js
          test -f src/agent-leases.js
          test -f src/agent-queries.js
          test -f src/executor-contracts.js
          test -f migrations/0001_foundation.sql
          test -f migrations/0002_agent_control.sql
          test -f openapi/sakthiai-v4.yaml
          test -f openapi/sakthiai-v5.yaml
          test -f scripts/test-auth.mjs
          test -f scripts/test-agent-state.mjs
          test -f scripts/test-executor-contracts.mjs
          test -f scripts/test_d1_migration.py
          test -f manifest.webmanifest
          test -f sw.js
          test -f offline.html
          grep -q 'SakthiAI' index.html
          grep -q 'prefers-reduced-motion' assets/styles.css
          grep -q 'serviceWorker' assets/app.js
          grep -q "import('./agent-control-ui.js')" assets/app.js
          grep -q 'SAI-V5 Agent Control Center' assets/agent-control-ui.js
          grep -q '"enabled": false' config/runtime-policy.json
          grep -q '"silentFallback": false' config/runtime-policy.json
          grep -q '"legacyRuntimeImport": false' config/runtime-policy.json
          grep -q '"agentControl": false' config/runtime-policy.json
          grep -q '"agentExecutorBindings": false' config/runtime-policy.json
          grep -q '"agentExternalActions": false' config/runtime-policy.json
          grep -q '"agentVerifier": false' config/runtime-policy.json
          grep -q '"externalExecutionImplemented": false' config/executor-contracts.json
          grep -q "url.pathname.startsWith('/api/')" sw.js
          ! grep -Rni 'Access-Control-Allow-Origin: \*' . --exclude-dir=.git
          ! grep -Rni 'saravanai.omsaravanabhava.org' assets config index.html src --exclude-dir=.git
          ! grep -RniE '(sk-|AIza|xox[baprs]-|ghp_|github_pat_)' assets config index.html src --exclude-dir=.git
      - name: JavaScript syntax validation
        shell: bash
        run: |
          set -euo pipefail
          find src scripts assets -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Flagship V5 policy validator
        run: node scripts/validate.mjs
      - name: Cloudflare Access JWT cryptographic test
        run: node scripts/test-auth.mjs
      - name: Agent state-machine test
        run: node scripts/test-agent-state.mjs
      - name: Executor contract safety test
        run: node scripts/test-executor-contracts.mjs
      - name: D1 V4 migration and tenant-isolation test
        run: python3 scripts/test_d1_migration.py
