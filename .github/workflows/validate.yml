name: Validate SakthiAI flagship
on:
  pull_request:
  push:
    branches: [main, release/flagship-v1]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Structural and safety validation
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f assets/styles.css
          test -f assets/app.js
          test -f assets/capabilities.js
          test -f assets/runtime.js
          test -f config/runtime-policy.json
          test -f manifest.webmanifest
          test -f sw.js
          test -f offline.html
          test -f src/worker.js
          test -f openapi/sakthiai-v1.yaml
          grep -q 'SakthiAI' index.html
          grep -q 'prefers-reduced-motion' assets/styles.css
          grep -q 'serviceWorker' assets/app.js
          grep -q 'No hidden autonomous writes' index.html
          grep -q '"enabled": false' config/runtime-policy.json
          grep -q '"silentFallback": false' config/runtime-policy.json
          grep -q '"legacyRuntimeImport": false' config/runtime-policy.json
          grep -q "url.pathname.startsWith('/api/')" sw.js
          ! grep -Rni 'Access-Control-Allow-Origin: \*' . --exclude-dir=.git
          ! grep -Rni 'saravanai.omsaravanabhava.org' assets config index.html src --exclude-dir=.git
          ! grep -RniE '(sk-|AIza|xox[baprs]-|ghp_|github_pat_)' assets config index.html src --exclude-dir=.git
      - name: Flagship policy validator
        run: node scripts/validate.mjs
