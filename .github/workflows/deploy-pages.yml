name: Deploy clean SakthiAI flagship

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sakthiai-pages-main
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        shell: bash
        run: find src scripts assets -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Live-release isolation validation
        run: node scripts/validate-live-release.mjs
      - name: Identity and authorization crypto test
        run: node scripts/test-auth.mjs
      - name: Agent state-machine test
        run: node scripts/test-agent-state.mjs
      - name: Executor contract test
        run: node scripts/test-executor-contracts.mjs
      - name: Preview readiness test
        run: node scripts/test-preview-readiness.mjs
      - name: Static responsive/accessibility contract test
        run: node scripts/test-static-ui.mjs
      - name: D1 schema isolation test
        run: python3 scripts/test_d1_migration.py
      - name: Build public-only flagship assets
        run: npm run build:site
      - name: Verify deployment package excludes source/control files
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/assets/styles.css
          test -f dist/assets/app.js
          test ! -e dist/src
          test ! -e dist/config
          test ! -e dist/migrations
          test ! -e dist/scripts
          test ! -e dist/.github
          ! grep -Rni 'Owner data is locked' dist
          ! grep -Rni 'Private evidence ingestion' dist
          ! grep -Rni 'Private AI Workspace' dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Deploy clean SakthiAI flagship to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
